name: "Pre Merge"

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  test:
    uses: ./.github/workflows/test.yaml
    secrets: inherit

  pre-merge:
    name: Pre Merge
    # Single check for rulesets to require: GitHub reports one check per job, never one per workflow
    # always(): a job skipped because a dependency failed reports success and would let the PR merge
    if: always()
    needs:
      - lint
      - test
    runs-on: ubuntu-26.04
    steps:
      - name: Fail if a pre-merge job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
